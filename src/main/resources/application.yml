spring:
  application:
    name: player-support-desk-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${APP_PROFILE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: 127.0.0.1
  port: 8080
